name: CI image

on:
  # Pick up Debian/security updates inside the same base tag.
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.ci
      - .python-version
      - .github/workflows/ci-image.yml

concurrency:
  group: ci-image
  cancel-in-progress: true

jobs:
  build:
    name: Rebuild CI image
    runs-on: videobrowser
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push
        run: |
          set -euo pipefail
          PY="$(tr -d '[:space:]' < .python-version)"
          CI_IMAGE="ghcr.io/tn8or/videobrowser/ci:${PY}-bookworm"
          if ! grep -qE "^FROM python:${PY}-bookworm@" Dockerfile.ci; then
            echo "Dockerfile.ci FROM does not match .python-version (${PY})" >&2
            exit 1
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          HASH="$(sha256sum Dockerfile.ci .python-version | sha256sum | awk '{print $1}')"
          docker build --pull --no-cache \
            --build-arg "DOCKERFILE_HASH=$HASH" \
            -f Dockerfile.ci \
            -t "$CI_IMAGE" .
          docker push "$CI_IMAGE"
          echo "Pushed $CI_IMAGE (dockerfile.hash=$HASH)"
