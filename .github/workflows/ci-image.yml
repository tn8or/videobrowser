name: CI image

on:
  # Pick up Debian/security updates inside the same base tag.
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.ci
      - .python-version
      - pyproject.toml
      - .github/workflows/ci-image.yml

concurrency:
  group: ci-image
  cancel-in-progress: true

jobs:
  build:
    name: Rebuild CI image
    runs-on: videobrowser
    permissions:
      contents: read
      packages: write
    env:
      PIP_INDEX_URL: ${{ secrets.PIP_INDEX_URL }}
      PIP_TRUSTED_HOST: ${{ secrets.PIP_TRUSTED_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and push
        run: |
          set -euo pipefail
          PY="$(tr -d '[:space:]' < .python-version)"
          if ! grep -qE "^FROM python:${PY}-bookworm@" Dockerfile.ci; then
            echo "Dockerfile.ci FROM does not match .python-version (${PY})" >&2
            exit 1
          fi
          # Must match the tag computed in ci.yml.
          HASH="$(sha256sum Dockerfile.ci .python-version pyproject.toml | sha256sum | cut -c1-12)"
          CI_IMAGE="ghcr.io/tn8or/videobrowser/ci:${PY}-bookworm-${HASH}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --pull --no-cache \
            --build-arg "DOCKERFILE_HASH=$HASH" \
            --build-arg PIP_INDEX_URL \
            --build-arg PIP_TRUSTED_HOST \
            -f Dockerfile.ci \
            -t "$CI_IMAGE" .
          docker run --rm "$CI_IMAGE" python -c "import sys; v=f'{sys.version_info.major}.{sys.version_info.minor}'; assert v == '${PY}', v"
          docker push "$CI_IMAGE"
          echo "Pushed $CI_IMAGE (dockerfile.hash=$HASH, python=${PY})"
