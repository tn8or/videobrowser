name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Ensure CI image
    runs-on: videobrowser
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve CI Python image
        id: pin
        run: |
          set -euo pipefail
          PY="$(tr -d '[:space:]' < .python-version)"
          if ! grep -qE "^FROM python:${PY}-bookworm@" Dockerfile.ci; then
            echo "Dockerfile.ci FROM does not match .python-version (${PY})" >&2
            exit 1
          fi
          # The tag is keyed on every image input (incl. Python deps), so
          # branches with different requirements never overwrite each other.
          # Must match the tag computed in ci-image.yml.
          HASH="$(sha256sum Dockerfile.ci .python-version pyproject.toml | sha256sum | cut -c1-12)"
          IMAGE="ghcr.io/tn8or/videobrowser/ci:${PY}-bookworm-${HASH}"
          echo "py=${PY}" >> "${GITHUB_OUTPUT}"
          echo "hash=${HASH}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "Using ${IMAGE}"

      - name: Build image if inputs changed
        env:
          CI_IMAGE: ${{ steps.pin.outputs.image }}
          HASH: ${{ steps.pin.outputs.hash }}
          PY: ${{ steps.pin.outputs.py }}
          PIP_INDEX_URL: http://pypi-proxy.github-arc.svc.cluster.local:8080/simple/
          PIP_TRUSTED_HOST: pypi-proxy.github-arc.svc.cluster.local
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker pull "$CI_IMAGE"; then
            docker run --rm "$CI_IMAGE" python -c "import sys; v=f'{sys.version_info.major}.{sys.version_info.minor}'; assert v == '${PY}', v"
            echo "Image up to date (hash=$HASH, python=${PY})"
            exit 0
          fi
          echo "Image missing; building"
          docker build --pull \
            --build-arg "DOCKERFILE_HASH=$HASH" \
            --build-arg PIP_INDEX_URL \
            --build-arg PIP_TRUSTED_HOST \
            -f Dockerfile.ci \
            -t "$CI_IMAGE" .
          docker run --rm "$CI_IMAGE" python -c "import sys; v=f'{sys.version_info.major}.{sys.version_info.minor}'; assert v == '${PY}', v"
          docker push "$CI_IMAGE"

  test:
    name: Tests
    needs: image
    runs-on: videobrowser
    permissions:
      contents: read
      packages: read
    env:
      CI_IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install package and run tests
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$CI_IMAGE"
          # DinD cannot bind-mount the runner workspace; stream the tree in via tar.
          # Dependencies are baked into the image; only the package is installed
          # here, without network (--no-deps, setuptools from the image).
          tar -C "$PWD" --exclude .git -czf - . | docker run --rm -i \
            "$CI_IMAGE" \
            bash -lc 'mkdir -p /workspace && tar -C /workspace -xzf - && cd /workspace && pip install --no-deps --no-build-isolation -e . && pip check && pytest -q'
