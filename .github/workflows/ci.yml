name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE: ghcr.io/tn8or/videobrowser/ci:3.12-bookworm

jobs:
  test:
    name: Tests
    runs-on: videobrowser
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure CI image
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker pull "$CI_IMAGE"; then
            echo "Using published $CI_IMAGE"
          else
            echo "Building $CI_IMAGE (one-time / Dockerfile.ci change)"
            docker build -f Dockerfile.ci -t "$CI_IMAGE" .
            docker push "$CI_IMAGE"
          fi

      - name: Install package and run tests
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            -e PIP_INDEX_URL \
            -e PIP_TRUSTED_HOST \
            -e PIP_DISABLE_PIP_VERSION_CHECK \
            "$CI_IMAGE" \
            bash -lc 'python -m pip install -U pip && pip install -e ".[dev]" && pytest -q'
