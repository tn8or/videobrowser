[build-system]
# SPDX license expressions (`license = "AGPL-3.0-only"`) need setuptools 77+.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "videobrowser"
version = "0.1.0"
description = "Extract interesting moments from motorcycle track-day GoPro footage"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.15"
dependencies = [
    "lap>=0.5.12",
    # AGPLv3+. Compatible with this project's AGPL-3.0-only license. Also
    # installs ultralytics-thop (AGPLv3+) and, on Python >= 3.11,
    # ultralytics-platform (AGPL-3.0-only). See THIRD_PARTY_NOTICES.md.
    "ultralytics>=8.3.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26",
    # On Linux, current PyPI wheels require proprietary NVIDIA CUDA runtimes,
    # including nvidia-nvshmem-cu13. Accepted as a redistributable runtime.
    # See THIRD_PARTY_NOTICES.md.
    "torch>=2.4",
    "tqdm>=4.66",
    "pycairo>=1.25.0",
    # IANA tz database; required on Windows so overlay clocks can use CEST/CET.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# RaceBox session auto-download (Playwright/Chromium). Requires
# `playwright install chromium` after installing.
fetch = ["playwright>=1.44.0"]

[project.scripts]
videobrowser = "videobrowser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
